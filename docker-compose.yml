services:
  postgres:
    image: postgres:17
    container_name: operations-postgres

    environment:
      POSTGRES_DB: operations
      POSTGRES_USER: operations_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U operations_user -d operations"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: